# Mandato — L2 blueprint.yaml
blueprints:
  - moment_ref: MOM-01
    frontstage:
      - "formulário estruturado: escopo (o que pode e não pode), orçamento-teto, critério de sucesso verificável, prazo"
      - "assistente sugere critério de sucesso mensurável a partir da descrição livre da tarefa"
    backstage:
      - { id: BCK-01, action: "geração assistida de critério de sucesso verificável a partir da descrição livre", sla_ms: 3000 }
      - { id: BCK-02, action: "checagem de que orçamento-teto e critério de sucesso estão preenchidos e mensuráveis" }
    policies:
      - id: POL-ESCOPO-01
        rule: "mandato só é publicado com orçamento-teto e critério de sucesso explícitos e mensuráveis"
        source: NG-02
        on_violation: "publicação bloqueada; mandante é direcionado a completar os campos"
    edge_cases:
      - id: EDG-01
        case: "mandante descreve a tarefa de forma vaga demais para gerar critério de sucesso mensurável (ex: 'me ajude a vender mais')"
        resolution: "assistente devolve perguntas de refinamento antes de permitir publicar; mandato não é criado sem critério mensurável"
        severity: media

  - moment_ref: MOM-02
    frontstage:
      - "vitrine de operadores com reputação verificada, taxa de conclusão sem disputa, especialidade e preço"
    backstage:
      - { id: BCK-03, action: "cálculo de score de reputação a partir de mandatos concluídos e verificados", sla_ms: 500 }
    policies:
      - id: POL-REP-01
        rule: "score de reputação só conta mandato com verificação concluída — mandato ainda em disputa não soma nem penaliza"
        source: PROB-02
        on_violation: "mandato em disputa é excluído do cálculo até resolução"
    edge_cases:
      - id: EDG-02
        case: "operador novo sem nenhum mandato concluído (cold start) — FAQ-05"
        resolution: "vitrine reserva uma faixa 'emergente' com mandatos de orçamento baixo e escrow reforçado, sinalizado ao mandante como 'operador novo, garantia extra ativa'"
        severity: media
      - id: EDG-03
        case: "dois operadores empatam em reputação e preço"
        resolution: "critério de desempate é tempo médio de execução verificado, exibido lado a lado na comparação"
        severity: baixa

  - moment_ref: MOM-04
    frontstage:
      - "painel de verificação: resultado entregue lado a lado com o critério de sucesso definido em MOM-01"
      - "score de verificação automática + campo de confirmação humana do mandante"
    backstage:
      - { id: BCK-11, action: "verificação automática do resultado contra o critério de sucesso, com amostragem por revisor independente do operador", sla_ms: 15000 }
      - { id: BCK-12, action: "liberação do escrow após verificação aprovada (automática ou confirmada pelo mandante)" }
    policies:
      - id: POL-VERIF-01
        rule: "pagamento em custódia só libera após verificação automática aprovar OU mandante confirmar manualmente — liberação automática por decurso de prazo silencioso é proibida"
        source: TEN-02
        on_violation: "escrow permanece retido; liberação por timeout é bloqueada no sistema"
    edge_cases:
      - id: EDG-04
        case: "verificação automática e mandante discordam do resultado (verificação aprova e mandante contesta, ou o inverso)"
        resolution: "escrow permanece retido e o mandato entra em disputa (JRN-DISPUTAR); nenhuma liberação até resolução"
        severity: alta
      - id: EDG-05
        case: "resultado parcialmente cumprido (ex: 8 de 10 itens do critério de sucesso atendidos)"
        resolution: "liberação proporcional do escrow ao percentual verificado, com o restante retido até complemento ou disputa"
        severity: media

  - moment_ref: MOM-10
    frontstage:
      - "nenhuma tela dedicada — a visibilidade deste momento acontece via MOM-03 (painel de acompanhamento ao vivo)"
    backstage:
      - { id: BCK-21, action: "execução do próximo passo da tarefa pelo agente, validada contra o escopo do mandato antes de qualquer ação com efeito externo (pagamento, mensagem, contrato)", sla_ms: 2000 }
      - { id: BCK-22, action: "registro do checkpoint com evidência (log da ação, resultado parcial, custo incorrido)" }
    policies:
      - id: POL-TETO-01
        rule: "nenhuma ação com custo que ultrapasse o orçamento-teto remanescente é executada — o agente pausa e solicita extensão"
        source: TEN-01
        on_violation: "ação é bloqueada antes da execução; mandato pausa até resposta do mandante"
    edge_cases:
      - id: EDG-06
        case: "agente identifica que cumprir o critério de sucesso como definido exige uma ação fora do escopo original (ex: mandato de 'negociar contrato' exige assinar, que não foi autorizado) — FAQ-01"
        resolution: "agente pausa, registra o motivo, e dispara MOM-11 (pedir autorização) — nunca decide sozinho por ampliar o próprio mandato"
        severity: alta
      - id: EDG-07
        case: "agente fica sem resposta de uma API ou serviço externo necessário para o próximo passo"
        resolution: "checkpoint marca 'bloqueado por dependência externa' com retry programado; mandante é notificado se o bloqueio ultrapassar 1 hora"
        severity: media

  - moment_ref: MOM-11
    frontstage:
      - "notificação ao mandante com o pedido específico de extensão (o quê, por quê, custo adicional) e prazo de resposta"
    backstage:
      - { id: BCK-23, action: "criação da solicitação de extensão vinculada ao mandato original, com execução pausada até resposta", sla_ms: 0 }
    policies:
      - id: POL-EXT-01
        rule: "a execução permanece pausada até o mandante aprovar, negar, ou o prazo de resposta expirar — silêncio nunca é autorização"
        source: TEN-01
        on_violation: "o agente não retoma a execução sem resposta explícita registrada"
    edge_cases:
      - id: EDG-08
        case: "mandante não responde à solicitação de extensão dentro do prazo (24h)"
        resolution: "mandato entra em estado 'pausado aguardando mandante'; nenhum custo adicional é incorrido; mandante pode retomar a qualquer momento"
        severity: media
      - id: EDG-09
        case: "a extensão solicitada colide com outro mandato ativo do mesmo mandante (ex: dois agentes tentando negociar com o mesmo fornecedor simultaneamente) — FAQ-04"
        resolution: "sistema sinaliza o conflito ao mandante antes de aprovar; aprovação simultânea de ambos os mandatos exige reconciliação explícita, nunca automática"
        severity: media

  - moment_ref: MOM-20
    frontstage:
      - "formulário de contestação: qual parte do critério de sucesso não foi cumprida, com evidência anexada"
    backstage:
      - { id: BCK-31, action: "abertura da disputa com congelamento imediato do escrow e do score de reputação do mandato", sla_ms: 1000 }
      - { id: BCK-32, action: "arbitragem: revisão humana independente do log de execução (checkpoints de BCK-22) contra o critério de sucesso", human: true }
    policies:
      - id: POL-DISP-01
        rule: "toda disputa é decidida com base no log de execução verificável (checkpoints), nunca apenas na palavra de uma das partes"
        source: TEN-03
        on_violation: "decisão sem lastro em checkpoint registrado é anulável em recurso"
    edge_cases:
      - id: EDG-10
        case: "ação do agente durante o mandato causa dano a terceiro (ex: negociação automática gera obrigação indevida com um fornecedor) — FAQ-02"
        resolution: "escrow cobre até o teto do mandato; o excedente aciona a apólice de responsabilidade obrigatória do operador, com limite informado ao mandante antes da contratação"
        severity: alta
      - id: EDG-11
        case: "operador desaparece durante a disputa e não responde à arbitragem"
        resolution: "a decisão é tomada apenas com base no log de execução registrado; a ausência do operador não posterga a resolução além do prazo do painel"
        severity: media
      - id: EDG-12
        case: "volume de disputas simultâneas excede a capacidade do painel de arbitragem"
        accepted_risk:
          owner: "PM"
          date: "2026-08-15"
          reason: "raro no MVP com volume inicial baixo de mandatos; fila com painel escalável e SLA de resposta será tratada na v2"
        severity: baixa
