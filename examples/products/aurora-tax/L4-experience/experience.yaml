# Aurora Tax — L4 experience.yaml
flows:
  - id: FLW-CONSULTA
    serves: [MOM-01, MOM-02, MOM-03, MOM-04]
    initial: compondo
    states:
      compondo:
        screen: SCR-EDITOR
        "on":
          SUBMETER:
            target: processando
            guard: VAL-INPUT-01
          EVT-ConsultaRecusada:
            target: recusada
            covers: [EDG-06]
      recusada:
        screen: SCR-RECUSA
        covers: [EDG-06]
        answers: [FAQ-13, NG-01]   # recusa elegante É a resposta à hard question
        must_render: [motivo_recusa, link_reformular]   # FAQ-13: recusa elegante, NG-01 explícito
        "on":
          REFORMULAR: { target: compondo }
      processando:
        screen: SCR-AGUARDE
        invoke: CMD-SubmeterConsulta
        must_render: [indicador_progresso]
        "on":
          EVT-ConsultaRespondida: { target: respondida }
          EVT-CitacaoInvalidada:  { target: reformulando }
          EVT-RespostaDegradada:  { target: degradada, covers: [EDG-07] }
          SEM_FUNDAMENTO:         { target: escalada, covers: [EDG-08] }
      reformulando:
        screen: SCR-AGUARDE
        must_render: [aviso_reverificacao]
        "on":
          EVT-ConsultaRespondida: { target: respondida }
      degradada:
        screen: SCR-RESPOSTA-PARCIAL
        covers: [EDG-07]
        must_render: [aviso_parcial, notificar_quando_completa]
        "on":
          EVT-ConsultaRespondida: { target: respondida }
      escalada:
        screen: SCR-ESCALADA
        covers: [EDG-08]
        must_render: [explicacao_sem_fundamento, prazo_revisao_humana]
      respondida:
        screen: SCR-RESPOSTA
        covers: [EDG-05]           # ressalva de vigência renderizada quando norma <24h
        must_render: [citacoes_clicaveis, selo_verificacao, ressalva_vigencia_quando_aplicavel]
        "on":
          AUDITAR_CITACAO: { target: auditando }
      auditando:
        screen: SCR-FONTE
        must_render: [texto_fonte_primaria, dispositivo_destacado]

  - id: FLW-RADAR
    serves: [MOM-10, MOM-11]
    initial: radar
    states:
      radar:
        screen: SCR-RADAR
        must_render: [normas_do_dia, impacto_por_cliente, pendentes_de_analise]
        # pendentes_de_analise implementa POL-RAD-01
        "on":
          COBERTURA_PARCIAL: { target: radar_parcial, covers: [EDG-21] }
          ABRIR_NORMA:       { target: detalhe_norma }
      radar_parcial:
        screen: SCR-RADAR
        covers: [EDG-21]
        must_render: [banner_cobertura_parcial]
        "on":
          ABRIR_NORMA: { target: detalhe_norma }
      detalhe_norma:
        screen: SCR-NORMA
        "on":
          ENCAMINHAR: { target: encaminhada, guard: VAL-RESP-01 }
      encaminhada:
        screen: SCR-CONFIRMACAO
        invoke: CMD-NotificarResponsavel

validations:
  - id: VAL-INPUT-01
    field: consulta.texto
    rule: "não-vazio, ≤ 4000 chars, tema tributário detectado"
    derived_from: EDG-06
  - id: VAL-RESP-01
    field: encaminhamento.responsavel
    rule: "responsável obrigatório e ativo na conta do cliente"
    derived_from: POL-RAD-01

screens:
  - { id: SCR-EDITOR,           components: [editor-consulta, sugestao-enquadramento], tokens_scope: "consulta.*" }
  - { id: SCR-RECUSA,           components: [recusa-card, cta-reformular], tokens_scope: "consulta.*" }
  - { id: SCR-AGUARDE,          components: [progresso, etapas-pipeline], tokens_scope: "consulta.*" }
  - { id: SCR-RESPOSTA,         components: [resposta-card, citacao-chip, selo-verificado, feedback-bar], tokens_scope: "consulta.*" }
  - { id: SCR-RESPOSTA-PARCIAL, components: [resposta-card, banner-parcial], tokens_scope: "consulta.*" }
  - { id: SCR-ESCALADA,         components: [escalada-card, prazo-badge], tokens_scope: "consulta.*" }
  - { id: SCR-FONTE,            components: [visualizador-norma, destaque-dispositivo], tokens_scope: "fonte.*" }
  - { id: SCR-RADAR,            components: [lista-normas, impacto-badge, banner-cobertura], tokens_scope: "radar.*" }
  - { id: SCR-NORMA,            components: [norma-detalhe, clientes-impactados], tokens_scope: "radar.*" }
  - { id: SCR-CONFIRMACAO,      components: [confirmacao-card], tokens_scope: "radar.*" }
