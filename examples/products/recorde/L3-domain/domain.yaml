# Recorde — L3 domain.yaml
events:
  - { id: EVT-PlanoTrocado,       aggregate: AGG-Assinatura, emitted_by: CMD-TrocarPlano }
  - { id: EVT-ProracaoCalculada,  aggregate: AGG-Assinatura, emitted_by: BCK-01 }
  - { id: EVT-FaturaEmitida,      aggregate: AGG-Fatura,     emitted_by: BCK-02 }
  - { id: EVT-AssinaturaPausada,  aggregate: AGG-Assinatura, emitted_by: CMD-PausarAssinatura }
  - { id: EVT-AssinaturaRetomada, aggregate: AGG-Assinatura, emitted_by: CMD-RetomarAssinatura }
  - { id: EVT-CobrancaTentada,    aggregate: AGG-Cobranca,   emitted_by: BCK-04 }
  - { id: EVT-CobrancaFalhou,     aggregate: AGG-Cobranca,   emitted_by: BCK-04 }
  - { id: EVT-CobrancaRecuperada, aggregate: AGG-Cobranca,   emitted_by: BCK-05 }
  - { id: EVT-AcessoSuspenso,     aggregate: AGG-Cobranca,   emitted_by: CMD-SuspenderAcesso }

commands:
  - { id: CMD-TrocarPlano,        actor: ACT-ASSINANTE, produces: [EVT-PlanoTrocado] }
  - { id: CMD-CalcularProracao,   actor: system,          produces: [EVT-ProracaoCalculada] }
  - { id: CMD-EmitirFatura,       actor: system,          produces: [EVT-FaturaEmitida] }
  - { id: CMD-PausarAssinatura,   actor: ACT-ASSINANTE, produces: [EVT-AssinaturaPausada] }
  - { id: CMD-RetomarAssinatura,  actor: ACT-ASSINANTE, produces: [EVT-AssinaturaRetomada] }
  - { id: CMD-CobrarRenovacao,    actor: system,          produces: [EVT-CobrancaTentada, EVT-CobrancaFalhou] }
  - { id: CMD-RetentarCobranca,   actor: system,          produces: [EVT-CobrancaRecuperada] }
  - { id: CMD-SuspenderAcesso,    actor: system,          produces: [EVT-AcessoSuspenso] }

reactions:
  - { id: RCT-01, when: EVT-PlanoTrocado,       then: CMD-CalcularProracao, implements: POL-PRORACAO-01 }
  - { id: RCT-02, when: EVT-ProracaoCalculada,  then: CMD-EmitirFatura,     implements: POL-FATURA-01 }
  - { id: RCT-03, when: EVT-CobrancaFalhou,     then: CMD-RetentarCobranca, implements: POL-RETRY-01 }
  - { id: RCT-04, when: EVT-AssinaturaRetomada, then: CMD-CobrarRenovacao,  implements: POL-RENOVA-01 }

aggregates:
  - id: AGG-Assinatura
    invariants: [POL-PRORACAO-01, POL-PAUSA-01, POL-RENOVA-01]
    note: "invariante de proração sequencial — cada troca recalcula com base no estado anterior, nunca cobra o mesmo período duas vezes — resposta estrutural a FAQ-04"
  - { id: AGG-Fatura,   invariants: [POL-FATURA-01] }
  - { id: AGG-Cobranca, invariants: [POL-RETRY-01] }

contexts:
  - id: CTX-Assinatura
    aggregates: [AGG-Assinatura]
    moments_served: [MOM-01, MOM-02, MOM-10, MOM-11]
  - id: CTX-Faturamento
    aggregates: [AGG-Fatura]
    moments_served: [MOM-03]
    relationship: { with: CTX-Assinatura, type: downstream-conformist }
  - id: CTX-Cobranca
    aggregates: [AGG-Cobranca]
    moments_served: [MOM-20, MOM-21]
    relationship: { with: CTX-Assinatura, type: customer-supplier }
